<script>
/* Route Claude calls to the Vercel serverless function */
window.claude = {
  async complete(input) {
    // Anthropic capacity blips ("Overloaded", HTTP 529) are transient — retry a
    // couple of times with backoff under the same spinner before giving up, so a
    // momentary overload doesn't kill a whole Discover run.
    const isRetryable = (err) => /overloaded|\b529\b/i.test((err && err.message) || '');
    let lastErr;
    for (let attempt = 1; attempt <= 3; attempt++) {
      try {
        return await this._completeOnce(input);
      } catch (err) {
        lastErr = err;
        if (!isRetryable(err) || attempt === 3) break;
        await new Promise(r => setTimeout(r, 1500 * attempt)); // 1.5s, then 3s
      }
    }
    if (isRetryable(lastErr)) {
      throw new Error('Anthropic is momentarily overloaded — their server capacity, not your query. It usually clears within a minute; tap Run again.');
    }
    throw lastErr;
  },
  async _completeOnce(input) {
    const messages = typeof input === 'string'
      ? [{ role: 'user', content: input }]
      : (input.messages || []);
    const body = {
      model: (typeof input === 'object' && input.model) || 'claude-sonnet-4-6',
      max_tokens: (typeof input === 'object' && input.max_tokens) || 1500,
      messages,
      // Stream end-to-end so the connection stays warm via continuous SSE events.
      // Mobile carriers/NATs drop idle TCP after ~30s, which was killing long Discover runs.
      stream: true,
    };
    if (typeof input === 'object' && input.system) body.system = input.system;
    if (typeof input === 'object' && input.tools) body.tools = input.tools;
    if (typeof input === 'object' && input.temperature !== undefined) body.temperature = input.temperature;

    // Vercel function cap is 300s; abort slightly above it to surface a clear
    // error rather than the browser's generic "Failed to fetch" when the
    // connection dies.
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 310000);

    const TIMEOUT_HINT = 'The server function is capped at 300s. Try a narrower query — fewer cities, a shorter time window, or a focused category.';

    const translateNetworkError = (err) => {
      if (err.name === 'AbortError') {
        return new Error('Request timed out after 310 seconds. ' + TIMEOUT_HINT);
      }
      if (err.message === 'Failed to fetch' || /network|load failed|connection|fetch failed/i.test(err.message || '')) {
        return new Error('Network error mid-request — the connection was dropped before the server responded. ' + TIMEOUT_HINT);
      }
      return err;
    };

    let res;
    try {
      res = await fetch('/api/claude', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal: ctrl.signal,
      });
    } catch (err) {
      clearTimeout(timer);
      throw translateNetworkError(err);
    }

    const contentType = res.headers.get('Content-Type') || '';

    // Streaming branch — server pipes Anthropic SSE through.
    if (contentType.includes('text/event-stream')) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let text = '';
      let stopReason = null;
      let errorMessage = null;
      const blockTypes = new Set();

      try {
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          // SSE events are separated by a blank line.
          let idx;
          while ((idx = buffer.indexOf('\n\n')) !== -1) {
            const eventStr = buffer.slice(0, idx);
            buffer = buffer.slice(idx + 2);
            if (!eventStr.trim()) continue;
            let dataStr = '';
            let eventName = '';
            for (const line of eventStr.split('\n')) {
              if (line.startsWith('event:')) eventName = line.slice(6).trim();
              else if (line.startsWith('data:')) dataStr += line.slice(5).trimStart();
            }
            if (!dataStr) continue;
            let data;
            try { data = JSON.parse(dataStr); } catch { continue; }
            // Surface both Anthropic error events and the server's own injected
            // `event: error` (e.g. if the upstream stream drops mid-flight).
            if (eventName === 'error' || data.type === 'error') {
              errorMessage = data.error?.message || data.message || JSON.stringify(data.error || data);
            } else if (data.type === 'content_block_start' && data.content_block?.type) {
              blockTypes.add(data.content_block.type);
            } else if (data.type === 'content_block_delta' && data.delta?.type === 'text_delta') {
              text += data.delta.text || '';
            } else if (data.type === 'message_delta' && data.delta?.stop_reason) {
              stopReason = data.delta.stop_reason;
            }
          }
        }
      } catch (err) {
        clearTimeout(timer);
        throw translateNetworkError(err);
      }
      clearTimeout(timer);

      if (errorMessage) throw new Error(errorMessage);
      if (text) return text;

      if (stopReason === 'max_tokens') {
        throw new Error('The model hit max_tokens before producing an answer (the search ate the budget). Try a narrower focus or a tighter time window.');
      }
      if (blockTypes.has('server_tool_use') || blockTypes.has('tool_use')) {
        throw new Error('The model started a web search but the answer was cut short. Likely a Vercel timeout (300s cap). Try a narrower focus.');
      }
      throw new Error('Empty response from the API. Check your Anthropic Console — make sure web search is enabled for your organisation.');
    }

    // Non-streaming branch (server returned application/json — usually an error
    // or the back-compat fallback when the upstream didn't open a stream).
    let text;
    try {
      text = await res.text();
    } catch (err) {
      clearTimeout(timer);
      throw translateNetworkError(err);
    }
    clearTimeout(timer);

    let data;
    try {
      data = JSON.parse(text);
    } catch {
      const snippet = text.slice(0, 200).replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      throw new Error(
        res.status === 504 || /timeout|gateway/i.test(snippet)
          ? 'Request timed out. ' + TIMEOUT_HINT
          : 'Server returned a non-JSON response: ' + snippet
      );
    }
    if (data.error) {
      const e = data.error;
      throw new Error(typeof e === 'string' ? e : (e.message || JSON.stringify(e)));
    }
    const blocks = data.content || [];
    const textParts = blocks.filter(b => b.type === 'text').map(b => b.text);
    if (textParts.length) return textParts.join('\n\n');

    console.warn('Claude response had no text blocks:', data);
    const types = blocks.map(b => b.type);
    if (data.stop_reason === 'max_tokens') {
      throw new Error('The model hit max_tokens before producing an answer (the search ate the budget). Try a narrower focus or a tighter time window.');
    }
    if (types.includes('tool_use') && !types.includes('tool_result')) {
      throw new Error('The model started a web search but the answer was cut short. Likely a Vercel timeout (300s cap). Try a narrower focus.');
    }
    if (data.stop_reason === 'tool_use') {
      throw new Error('The model is still mid-search — Vercel probably cut the request short. Try a narrower focus.');
    }
    if (types.length === 0) {
      throw new Error('Empty response from the API. Check your Anthropic Console — make sure web search is enabled for your organisation.');
    }
    throw new Error('Unexpected response shape: blocks=[' + types.join(', ') + '], stop_reason=' + (data.stop_reason || 'none'));
  },
};
</script>

<script type="text/babel" data-presets="react">
const useState = React.useState;
const useEffect = React.useEffect;
const useMemo = React.useMemo;

const TWEAK_DEFAULS = {
  view: "ledger",
  layout: "list",
  quoteStyle: "postcard",
  theme: "light",
};

// Bump on every deploy (keep in step with the sw.js cache version) so it's
// visible in-app that the new build is live.
const APP_VERSION = 'v26 · 5 Jul 2026';

// Legacy poems (pre-v24) kept their verse in `title`. Move it across once,
// wherever entries enter state, so `title` can hold a real title.
const normalizePoems = (list) => list.map(e =>
  e.category === 'poem' && !e.verse && /\n/.test(e.title || '')
    ? { ...e, verse: e.title, title: '' }
    : e
);

function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem('enth-v2') || '{}'); } catch { return {}; } })();
  const [tab, setTab] = useState(saved.tab || 'archive');
  const [viewId, setViewId] = useState(saved.viewId || null);
  const [editOpen, setEditOpen] = useState(false);
  const [editEntry, setEditEntry] = useState(null);
  const [titleOpen, setTitleOpen] = useState(false);
  const [filter, setFilter] = useState(null);
  const [search, setSearch] = useState('');
  const [tweaks, setTweaks] = useState(() => {
    let t;
    try { t = { ...TWEAK_DEFAULS, ...(JSON.parse(localStorage.getItem('enth-tweaks') || '{}')) }; }
    catch { t = { ...TWEAK_DEFAULS }; }
    // Postcards/Spread used to be top-level views; they're now layouts of the
    // Ledger sheet. Migrate any saved choice so nothing breaks on first load.
    if (t.view === 'postcards' || t.view === 'spread') { t.layout = t.view; t.view = 'ledger'; }
    return t;
  });

  useEffect(() => {
    localStorage.setItem('enth-tweaks', JSON.stringify(tweaks));
    document.body.className = tweaks.theme === 'dark' ? 'theme-dark' : 'theme-light';
  }, [tweaks]);

  // The Antechamber — wants (proto-entries) waiting to be lived.
  const [wants, setWants] = useState(loadWants);
  const [addingWant, setAddingWant] = useState(false);
  // Set while an EditModal was opened from a want ("Lived it"); on save,
  // that want leaves the antechamber.
  const pendingWantRef = React.useRef(null);
  useEffect(() => { saveWants(wants); }, [wants]);

  const [entries, setEntries] = useState(() => {
    try {
      const stored = localStorage.getItem('enth-entries-v2');
      if (stored) return normalizePoems(JSON.parse(stored));
    } catch {}
    // fall back to local backup if present
    try {
      const legacy = localStorage.getItem('enthousiasmes-data');
      if (legacy) return normalizePoems(JSON.parse(legacy));
    } catch {}
    return normalizePoems(ENTRIES);
  });
  useEffect(() => {
    localStorage.setItem('enth-entries-v2', JSON.stringify(entries));
  }, [entries]);

  // ── The cloud ledger (#8) ── signed in → Supabase is the source of
  // truth and every write goes to both; signed out → this device only,
  // with writes queued for the next sign-in.
  const [session, setSession] = useState(undefined); // undefined = still checking
  const [localOnly, setLocalOnly] = useState(() => localStorage.getItem('enth-local-only') === '1');
  const [syncErr, setSyncErr] = useState(null);
  const [migrateCount, setMigrateCount] = useState(0);
  // Entries on this device that the (non-empty) cloud doesn't hold —
  // kept visible and reconciled explicitly, never dropped in silence.
  const [strays, setStrays] = useState(null);
  const entriesRef = React.useRef(entries);
  entriesRef.current = entries;

  useEffect(() => {
    if (!db.available) { setSession(null); setLocalOnly(true); return; }
    db.session().then(s => setSession(s));
    return db.onAuth(s => {
      setSession(s);
      if (s) { localStorage.removeItem('enth-local-only'); setLocalOnly(false); }
    });
  }, []);

  // On sign-in: flush queued writes, then adopt the cloud archive. An
  // empty cloud against a full device is the one-time migration moment.
  useEffect(() => {
    if (!session) return;
    let stale = false;
    (async () => {
      try {
        await db.flushPending();
        const rows = await db.fetchEntries();
        if (stale) return;
        setSyncErr(null);
        if (rows.length === 0 && entriesRef.current.length > 0) {
          setMigrateCount(entriesRef.current.length);
        } else {
          setMigrateCount(0);
          const clean = normalizePoems(rows);
          const cloudIds = new Set(clean.map(r => r.id));
          const local = entriesRef.current.filter(e => !cloudIds.has(e.id));
          setStrays(local.length ? local : null);
          setEntries(local.length ? [...local, ...clean] : clean);
        }
      } catch (err) {
        if (!stale) setSyncErr(err.message);
      }
    })();
    return () => { stale = true; };
  }, [session && session.user.id]);

  const cloudUpsert = (e) => {
    if (session) db.pushEntry(e).catch(err => setSyncErr(err.message));
    else db.queueUpsert(e);
  };
  const cloudDelete = (id) => {
    if (session) db.removeEntry(id).catch(err => setSyncErr(err.message));
    else db.queueDelete(id);
  };
  const inscribeAll = async () => {
    try {
      await db.replaceAll(entriesRef.current);
      setMigrateCount(0); setSyncErr(null);
    } catch (err) { setSyncErr(err.message); }
  };
  // #11 — a found cover is written straight onto its entry (and the cloud).
  const setCover = (book, url) => {
    setEntries(es => es.map(e => e.id === book.id ? { ...e, image: url } : e));
    cloudUpsert({ ...book, image: url });
  };
  const inscribeStrays = () => {
    (strays || []).forEach(cloudUpsert);
    setStrays(null);
  };
  const releaseStrays = () => {
    const ids = new Set((strays || []).map(e => e.id));
    setEntries(es => es.filter(e => !ids.has(e.id)));
    setStrays(null);
  };

  useEffect(() => {
    localStorage.setItem('enth-v2', JSON.stringify({ tab, viewId }));
  }, [tab, viewId]);

  const setTweak = (key, value) => setTweaks(t => ({ ...t, [key]: value }));

  const filtered = useMemo(() => {
    return entries.filter(e => {
      if (filter && e.category !== filter) return false;
      if (search) {
        const s = search.toLowerCase();
        const hay = [e.title, e.verse, e.note, ...Object.values(e.metadata || {})].join(' ').toLowerCase();
        if (!hay.includes(s)) return false;
      }
      return true;
    });
  }, [entries, filter, search]);

  const counts = useMemo(() => {
    const m = {};
    entries.forEach(e => { m[e.category] = (m[e.category] || 0) + 1; });
    return m;
  }, [entries]);

  const currentEntry = viewId ? entries.find(e => e.id === viewId) : null;

  const openEntry = (e) => setViewId(e.id);
  const backArchive = () => setViewId(null);
  const openEdit = (e) => { setEditEntry(e || null); setEditOpen(true); };

  const saveEntry = (form) => {
    // The chosen photograph travels beside the form, never inside the entry.
    const { _imageBlob, _imageData, ...clean } = form;
    const t = (clean.title || '').trim();
    if (!t && !(clean.verse || '').trim()) return;

    // Upload after the entry exists; the path lands on `image` and syncs.
    const attachPhoto = (saved) => {
      if (!_imageBlob) return;
      if (!session) { setSyncErr('Sign in to add photographs.'); return; }
      db.uploadImage(saved.id, _imageBlob).then(path => {
        const withImg = { ...saved, image: path };
        setEntries(es => es.map(e => e.id === saved.id ? withImg : e));
        cloudUpsert(withImg);
      }).catch(err => setSyncErr(err.message));
    };

    if (clean.id) {
      const before = entries.find(e => e.id === clean.id);
      const updated = { ...before, ...clean };
      setEntries(es => es.map(e => e.id === clean.id ? updated : e));
      cloudUpsert(updated);
      // a replaced or removed photograph leaves no orphan in storage
      if (before && before.image && !/^https?:/.test(before.image) && before.image !== updated.image) {
        db.removeImage(before.image);
      }
      attachPhoto(updated);
    } else {
      const maxN = entries.reduce((m, e) => Math.max(m, e.n || 0), 0);
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      const fresh = { ...clean, id, n: maxN + 1 };
      setEntries(es => [fresh, ...es]);
      cloudUpsert(fresh);
      attachPhoto(fresh);
      if (pendingWantRef.current) {
        const wid = pendingWantRef.current;
        setWants(ws => ws.filter(w => w.id !== wid));
      }
    }
    pendingWantRef.current = null;
    setEditOpen(false);
  };

  // "Lived it" — a want becomes a prefilled new entry; saved → it leaves
  // the antechamber.
  const liveWant = (w) => {
    pendingWantRef.current = w.id;
    setEditEntry({
      title: w.title || '',
      category: wantCatId(w),
      date: new Date().toISOString().slice(0, 10),
      note: '',
      metadata: {
        ...(w.metadata || {}),
        ...(w.artist ? { artist: w.artist } : {}),
        ...(w.venue ? { venue: w.venue } : {}),
        ...(w.url ? { link: w.url } : {}),
      },
    });
    setEditOpen(true);
  };
  const deleteEntry = () => {
    if (!editEntry?.id) { setEditOpen(false); return; }
    if (!confirm('Delete this enthusiasm?')) return;
    setEntries(es => es.filter(e => e.id !== editEntry.id));
    cloudDelete(editEntry.id);
    if (editEntry.image && !/^https?:/.test(editEntry.image)) db.removeImage(editEntry.image);
    setViewId(null);
    setEditOpen(false);
  };
  const toggleFav = (id) => {
    const cur = entries.find(e => e.id === id);
    if (!cur) return;
    const updated = { ...cur, favourite: !cur.favourite };
    setEntries(es => es.map(e => e.id === id ? updated : e));
    cloudUpsert(updated);
  };
  const importEntries = (data) => {
    if (!Array.isArray(data)) return;
    const numbered = normalizePoems([...data].sort((a,b) => (b.date || '').localeCompare(a.date || ''))
      .map((e, i) => ({ ...e, n: e.n || i + 1 })));
    setEntries(numbered);
    // An import replaces the archive, cloud included.
    if (session) db.replaceAll(numbered).catch(err => setSyncErr(err.message));
    else numbered.forEach(e => db.queueUpsert(e));
    setViewId(null);
  };

  const body = (() => {
    if (titleOpen) return <TitlePage count={entries.length} onClose={() => setTitleOpen(false)} />;
    if (currentEntry) return <DetailView entry={currentEntry} onBack={backArchive} onEdit={() => openEdit(currentEntry)} onFav={() => toggleFav(currentEntry.id)} />;
    if (tab === 'insights') return <InsightsView entries={entries} onOpen={openEntry} />;
    if (tab === 'discover') return <DiscoverView entries={entries} wants={wants} onWants={setWants} />;
    if (tab === 'antechamber') return (
      <AntechamberView wants={wants} entries={entries} onChange={setWants} onLived={liveWant}
        adding={addingWant} onAdding={setAddingWant} />
    );
    return (
      <>
        <Masthead date={new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase()} count={entries.length} onOpenTitle={() => setTitleOpen(true)} />
        {migrateCount > 0 && (
          <div className="no-print" style={{
            margin: '0 20px 16px', padding: '14px 16px', textAlign: 'center',
            border: '0.5px solid var(--line)', background: 'var(--card)',
          }}>
            <div className="serif-ital" style={{ fontSize: 13.5, color: 'var(--ink-soft)', marginBottom: 10 }}>
              The cloud ledger stands empty. Inscribe this device's {migrateCount} entries into it?
            </div>
            <button onClick={inscribeAll} className="eyebrow" style={{
              border: '0.5px solid var(--line)', background: 'var(--card)',
              color: 'var(--rubric)', padding: '8px 18px', borderRadius: 2, cursor: 'pointer',
            }}>
              Inscribe them
            </button>
          </div>
        )}
        {strays && (
          <div className="no-print" style={{
            margin: '0 20px 16px', padding: '14px 16px', textAlign: 'center',
            border: '0.5px solid var(--line)', background: 'var(--card)',
          }}>
            <div className="serif-ital" style={{ fontSize: 13.5, color: 'var(--ink-soft)', marginBottom: 10 }}>
              {strays.length === 1 ? 'One entry on this device is' : strays.length + ' entries on this device are'} not
              yet in the cloud ledger.
            </div>
            <button onClick={inscribeStrays} className="eyebrow" style={{
              border: '0.5px solid var(--line)', background: 'var(--card)',
              color: 'var(--rubric)', padding: '8px 18px', borderRadius: 2, cursor: 'pointer', marginRight: 10,
            }}>
              Inscribe them
            </button>
            <button onClick={releaseStrays} className="eyebrow" style={{
              background: 'none', border: 'none', color: 'var(--ink-faint)', cursor: 'pointer', padding: '8px 6px',
            }}>
              Let them go
            </button>
          </div>
        )}
        <div className="no-print" style={{ padding: '0 20px 10px' }}>
          <ViewSwitcher view={tweaks.view} onView={v => setTweak('view', v)}/>
          {tweaks.view === 'ledger' && (
            <div style={{ display: 'flex', justifyContent: 'center', gap: 4, padding: '0 0 12px' }}>
              {[{ id: 'list', label: 'List' }, { id: 'postcards', label: 'Postcards' }, { id: 'spread', label: 'Spread' }].map((l, i) => (
                <React.Fragment key={l.id}>
                  {i > 0 && <span className="folio" style={{ alignSelf: 'center', opacity: 0.6 }}>·</span>}
                  <button onClick={() => setTweak('layout', l.id)} className="eyebrow" style={{
                    padding: '2px 6px', fontSize: 9,
                    color: (tweaks.layout || 'list') === l.id ? 'var(--rubric)' : 'var(--ink-faint)',
                  }}>
                    {l.label}
                  </button>
                </React.Fragment>
              ))}
            </div>
          )}
          {tweaks.view !== 'map' && (
            <>
              <SearchBar value={search} onChange={setSearch}/>
              <div style={{ margin: '10px -20px 8px', padding: '0 20px' }}>
                <ChipRow filter={filter} onFilter={setFilter} counts={counts}/>
              </div>
            </>
          )}
        </div>
        {tweaks.view !== 'map' && !filter && !search && (
          <div className="no-print" style={{ padding: '0 20px' }}>
            <ReEncounter entries={entries} onOpen={openEntry}/>
          </div>
        )}
        {tweaks.view === 'map'
          ? <MapView entries={entries} onOpen={openEntry}/>
          : tweaks.layout === 'postcards'
          ? <PostcardsView entries={filtered} onOpen={openEntry}/>
          : tweaks.layout === 'spread'
          ? <SpreadView entries={filtered} onOpen={openEntry}/>
          : <LedgerView entries={filtered} onOpen={openEntry} quoteStyle={tweaks.quoteStyle}/>
        }
        {tweaks.view !== 'map' && (
          <div className="no-print" style={{ padding: '0 20px' }}>
            <CoversBackfill entries={entries} onCover={setCover} />
            <DescriptionsBackfill entries={entries} />
            <ExportImport entries={entries} onImport={importEntries}/>
          </div>
        )}
        <div className="no-print" style={{ textAlign: 'center', padding: '18px 20px 4px' }}>
          <span className="folio" style={{ fontSize: 9, opacity: 0.7 }}>The Interior · build {APP_VERSION}</span>
          <div className="folio" style={{ fontSize: 9, opacity: 0.7, marginTop: 4 }}>
            {session ? (
              <>kept in the cloud · {session.user.email} · <button onClick={() => db.signOut()} className="folio" style={{
                fontSize: 9, color: 'var(--rubric)', background: 'none', border: 'none', cursor: 'pointer', padding: 0,
              }}>sign out</button></>
            ) : (
              <>this device only · <button onClick={() => { localStorage.removeItem('enth-local-only'); setLocalOnly(false); }} className="folio" style={{
                fontSize: 9, color: 'var(--rubric)', background: 'none', border: 'none', cursor: 'pointer', padding: 0,
              }}>sign in to sync</button></>
            )}
          </div>
          {syncErr && (
            <div className="serif-ital" style={{ fontSize: 11, color: 'var(--rubric)', marginTop: 4 }}>sync: {syncErr}</div>
          )}
        </div>
      </>
    );
  })();

  const isDark = tweaks.theme === 'dark';

  // Still checking for a session — a beat of blank paper, no flash of the gate.
  if (session === undefined) {
    return <div className={'app-shell ' + (isDark ? 'theme-dark' : 'theme-light')} />;
  }
  // Signed out and not in device-only mode: the key sits in the lock.
  if (!session && !localOnly) {
    return (
      <div className={'app-shell ' + (isDark ? 'theme-dark' : 'theme-light')}>
        <SignInView onLocal={() => { localStorage.setItem('enth-local-only', '1'); setLocalOnly(true); }} />
      </div>
    );
  }

  return (
    <div className={'app-shell ' + (isDark ? 'theme-dark' : 'theme-light')}>
      <div className="paper" style={{
        minHeight: '100%',
        background: isDark ? 'var(--d-paper)' : 'var(--paper)',
        color: isDark ? 'var(--d-ink)' : 'var(--ink)',
        paddingTop: 8,
      }}>
        <div style={{ position: 'relative', zIndex: 1 }}>
          {body}
        </div>
        {!currentEntry && !editOpen && (
          <Seal onClick={() => tab === 'antechamber' ? setAddingWant(true) : openEdit(null)} />
        )}
      </div>
      <TabBar tab={tab} onTab={t => { setViewId(null); setTab(t); }} dark={isDark} />
      {editOpen && (
        <EditModal
          entry={editEntry}
          canUpload={!!session}
          onClose={() => { pendingWantRef.current = null; setEditOpen(false); }}
          onSave={saveEntry}
          onDelete={deleteEntry}
        />
      )}

      {/* small theme toggle, top-right */}
      <button onClick={() => setTweak('theme', isDark ? 'light' : 'dark')} aria-label="Toggle theme" className="no-print" style={{
        position: 'fixed', top: 14, right: 14, zIndex: 70,
        width: 32, height: 32, borderRadius: '50%',
        border: '0.5px solid ' + (isDark ? 'var(--d-line)' : 'var(--line)'),
        background: isDark ? 'var(--d-card)' : 'var(--card)',
        color: isDark ? 'var(--d-ink)' : 'var(--ink)',
        fontFamily: 'var(--serif)', fontStyle: 'italic', fontSize: 14,
        cursor: 'pointer',
      }}>
        {isDark ? '☾' : '☀'}
      </button>
    </div>
  );
}

function SearchBar({ value, onChange }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 8,
      padding: '10px 12px',
      border: '0.5px solid var(--line)',
      background: 'var(--card)',
    }}>
      <span style={{ fontFamily: 'var(--serif)', fontStyle: 'italic', fontSize: 14, color: 'var(--ink-faint)' }}>⌕</span>
      <input value={value} onChange={e => onChange(e.target.value)}
        placeholder="Search by keyword, feeling, author…"
        style={{ flex: 1, border: 'none', background: 'transparent', fontFamily: 'var(--serif)', fontStyle: 'italic', fontSize: 14, outline: 'none', color: 'var(--ink)' }}/>
    </div>
  );
}

/* The gate — email in, six-figure code back, the archive unlocks.
   A quiet path below keeps the app usable on this device alone. */
function SignInView({ onLocal }) {
  const [email, setEmail] = useState(localStorage.getItem('enth-auth-email') || '');
  const [code, setCode] = useState('');
  const [stage, setStage] = useState('email');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  const send = async () => {
    if (!email.trim() || busy) return;
    setBusy(true); setErr(null);
    try {
      await db.sendCode(email.trim());
      localStorage.setItem('enth-auth-email', email.trim());
      setStage('code');
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };
  const verify = async () => {
    if (!code.trim() || busy) return;
    setBusy(true); setErr(null);
    try { await db.verifyCode(email.trim(), code.trim()); }
    catch (e) { setErr(e.message); setBusy(false); }
    // on success the auth listener re-renders the app signed in
  };

  const inputStyle = {
    width: '100%', boxSizing: 'border-box', padding: '12px 14px',
    border: '0.5px solid var(--line)', background: 'var(--card)',
    fontFamily: 'var(--serif)', fontSize: 16, color: 'var(--ink)',
    outline: 'none', borderRadius: 2,
  };
  const buttonStyle = {
    border: '0.5px solid var(--line)', background: 'var(--card)',
    color: 'var(--rubric)', padding: '10px 22px', borderRadius: 2, cursor: 'pointer',
  };
  const quietStyle = { background: 'none', border: 'none', color: 'var(--ink-faint)', cursor: 'pointer' };

  return (
    <div style={{ maxWidth: 340, margin: '0 auto', padding: '16vh 24px 0', textAlign: 'center' }}>
      <div className="eyebrow rubric" style={{ marginBottom: 14 }}>The Interior</div>
      <div className="serif-display" style={{ fontSize: 26, marginBottom: 8 }}>A private edition</div>
      <div className="serif-ital" style={{ fontSize: 13.5, color: 'var(--ink-soft)', marginBottom: 26 }}>
        {stage === 'email'
          ? 'The archive is kept under key. Leave your address and a letter will come by return.'
          : <>The letter is on its way to <span className="rubric">{email.trim()}</span>. Tap the link
            inside on this device — or type the code, if it carries one.</>}
      </div>
      {stage === 'email' ? (
        <>
          <input style={inputStyle} type="email" value={email} placeholder="your@address" autoFocus
            onChange={e => setEmail(e.target.value)} onKeyDown={e => e.key === 'Enter' && send()} />
          <div style={{ marginTop: 16 }}>
            <button className="eyebrow" style={buttonStyle} onClick={send} disabled={busy}>
              {busy ? 'Sending…' : 'Send the code'}
            </button>
          </div>
        </>
      ) : (
        <>
          <input style={{ ...inputStyle, textAlign: 'center', letterSpacing: '0.4em', fontFamily: 'var(--mono)' }}
            inputMode="numeric" value={code} placeholder="······" autoFocus
            onChange={e => setCode(e.target.value)} onKeyDown={e => e.key === 'Enter' && verify()} />
          <div style={{ marginTop: 16 }}>
            <button className="eyebrow" style={buttonStyle} onClick={verify} disabled={busy}>
              {busy ? 'Unlocking…' : 'Enter'}
            </button>
          </div>
          <div style={{ marginTop: 12 }}>
            <button className="eyebrow" style={quietStyle} onClick={() => { setStage('email'); setCode(''); }}>
              ← another address
            </button>
          </div>
        </>
      )}
      {err && <div className="serif-ital" style={{ fontSize: 12.5, color: 'var(--rubric)', marginTop: 14 }}>{err}</div>}
      <div style={{ marginTop: 44 }}>
        <button className="eyebrow" style={quietStyle} onClick={onLocal}>
          Not now — keep to this device
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

/* keyboard shortcuts */
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && !e.target.matches('input,textarea')) {
    e.preventDefault();
    document.querySelector('.app-shell input[placeholder*="Search"]')?.focus();
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
</body>
</html>
